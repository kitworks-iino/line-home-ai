name: CI
on:
  push:
    branches: [main, fix/d1-attachments-without-r2]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Package verified sources and Worker build
        if: always()
        run: |
          mkdir -p verification-artifact
          git archive --format=tar.gz HEAD > verification-artifact/source.tar.gz
          if [ -d dist ]; then cp -R dist verification-artifact/dist; fi
          if [ -f package-lock.json ]; then cp package-lock.json verification-artifact/package-lock.json; fi
          git rev-parse HEAD > verification-artifact/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-worker-${{ github.sha }}
          path: verification-artifact/
          retention-days: 1
  production-http:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kitworks-iino/line-home-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify deployed HTTP health and signature rejection
        run: node scripts/production-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-http-${{ github.sha }}
          path: production-http-artifact/
          retention-days: 1
