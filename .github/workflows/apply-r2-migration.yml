name: Apply and verify R2-free migration
on:
  push:
    branches: [fix/d1-attachments-without-r2]
    paths:
      - scripts/apply-r2-migration.py
      - scripts/runtime-smoke.mjs
      - src/media-store.ts
      - .github/workflows/apply-r2-migration.yml
permissions:
  contents: read
jobs:
  migrate:
    if: github.repository == 'kitworks-iino/line-home-ai' && github.ref == 'refs/heads/fix/d1-attachments-without-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply reviewed source transformations
        run: python scripts/apply-r2-migration.py
      - run: npm install --no-audit --no-fund
      - name: Preserve exact test-runtime dependencies for reproducible diagnosis
        run: |
          mkdir -p verification-artifact
          tar -czf verification-artifact/runtime-dependencies.tar.gz node_modules
          cp node_modules/miniflare/dist/src/index.d.ts verification-artifact/miniflare-contract.d.ts
      - name: Typecheck, regression tests, workerd/D1 integration and build
        run: |
          npm run check > verification-artifact/check.log 2>&1 || { tail -100 verification-artifact/check.log; exit 1; }
          tail -40 verification-artifact/check.log
      - name: Commit only after successful verification
        run: |
          rm scripts/apply-r2-migration.py .github/workflows/apply-r2-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github package.json package-lock.json wrangler.jsonc src tests docs scripts README.md
          git commit -m 'feat: migrate Home AI attachments to D1 without R2; verify runtime and boundaries'
          git push origin HEAD:fix/d1-attachments-without-r2
      - name: Package verified source and build
        if: always()
        run: |
          mkdir -p verification-artifact
          git archive --format=tar.gz HEAD > verification-artifact/source.tar.gz
          git rev-parse HEAD > verification-artifact/commit.txt
          git diff > verification-artifact/uncommitted.patch
          if [ -d dist ]; then cp -R dist verification-artifact/dist; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-verification-${{ github.run_id }}
          path: verification-artifact/
          retention-days: 1
