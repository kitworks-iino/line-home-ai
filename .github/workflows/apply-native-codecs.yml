name: Apply native binary codecs and verify
on:
  push:
    branches: [fix/d1-native-codecs]
    paths:
      - scripts/apply-native-codecs.py
      - .github/workflows/apply-native-codecs.yml
permissions:
  contents: read
jobs:
  optimize:
    if: github.repository == 'kitworks-iino/line-home-ai' && github.ref == 'refs/heads/fix/d1-native-codecs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: python scripts/apply-native-codecs.py
      - run: npm ci --no-audit --no-fund
      - name: Verify tests and D1 runtime
        run: |
          mkdir -p verification-artifact
          npm run check > verification-artifact/check.log 2>&1 || { tail -100 verification-artifact/check.log; exit 1; }
          tail -50 verification-artifact/check.log
      - name: Commit verified optimization
        run: |
          rm scripts/apply-native-codecs.py .github/workflows/apply-native-codecs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github package.json package-lock.json src scripts tests docs
          git commit -m 'perf: use native binary codecs and skip duplicate attachment uploads; add production HTTP checks'
          git push origin HEAD:fix/d1-native-codecs
      - name: Package verification
        if: always()
        run: |
          mkdir -p verification-artifact
          git archive --format=tar.gz HEAD > verification-artifact/source.tar.gz
          git rev-parse HEAD > verification-artifact/commit.txt
          git diff > verification-artifact/uncommitted.patch
          if [ -d dist ]; then cp -R dist verification-artifact/dist; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-codecs-verification-${{ github.run_id }}
          path: verification-artifact/
          retention-days: 1
